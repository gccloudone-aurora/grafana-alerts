# Creates optional Kubernetes Secrets used by contact points.

# Usage: Supply only AVP placeholders through private Aurora values, never literal
# credentials. Disable managed creation when another controller owns the Secret.
{{- range $key, $secret := .Values.managedSecrets }}
{{- if $secret.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required (printf "managedSecrets.%s.name is required" $key) $secret.name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    app.kubernetes.io/name: grafana-alerting-contact-points
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: grafana-system
    app.kubernetes.io/managed-by: argo
type: Opaque
stringData:
{{- range $dataKey, $dataValue := $secret.stringData }}
  {{ $dataKey | quote }}: {{ required (printf "managedSecrets.%s.stringData.%s is required when the Secret is enabled" $key $dataKey) $dataValue | quote }}
{{- end }}
{{- end }}
{{- end }}